name: Package

on:
  push:
    branches:
      - 'release/**'
    tags:
      - '**'
  pull_request:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pack, smoke-test and hash package
        run: |
          mkdir -p package-artifact
          npm pack --pack-destination package-artifact
          tarball="$(find package-artifact -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          npm run test:package -- "$tarball"
          cd package-artifact
          sha256sum *.tgz | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: timeline-composition-${{ github.sha }}
          path: package-artifact/
